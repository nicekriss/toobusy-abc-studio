[project]
name = "toobusy-abc-studio"
description = "ComfyUI 안에서 피아노롤로 멜로디를 그려 ABC 악보 텍스트로 만드는 편집기."
version = "0.4.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "너무바쁜베짱이 (toobusy)" }]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "comfyui-custom-nodes",
    "abc-notation",
    "piano-roll",
    "melody",
    "score",
    "music",
    "yue2",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/nicekriss/toobusy-abc-studio"
"Bug Tracker" = "https://github.com/nicekriss/toobusy-abc-studio/issues"
